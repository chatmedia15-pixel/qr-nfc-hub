<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Memuat...</title>
    <style>
        body { 
            font-family: Arial, sans-serif; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            margin: 0; 
            background: #000000; 
            color: #ffffff; 
            text-align: center; 
        }
    </style>
</head>
<body>
    <div>
        <p style="color: #888; font-size: 14px;" id="status">Memuat...</p>
    </div>

    <script>
        async function handleRedirect() {
            const urlParams = new URLSearchParams(window.location.search);
            const subId = urlParams.get('id');

            if (!subId) {
                window.location.replace('/admin.html');
                return;
            }

            try {
                const csvUrl = 'https://docs.google.com/spreadsheets/d/1EVqMj-V9Y6r0fclk7tYVQB8Co9fQ1JEmsAhcTXXGVM/export?format=csv';
                
                const response = await fetch(csvUrl);
                const csvText = await response.text();

                const lines = csvText.trim().split('\n');
                
                if (lines.length < 2) {
                    document.getElementById('status').innerText = 'Database CSV kosong.';
                    return;
                }

                let matchedRow = null;
                const cleanSearchId = subId.trim().toLowerCase();

                for (let i = 1; i < lines.length; i++) {
                    const line = lines[i].trim();
                    if (!line) continue;
                    
                    // Pisahkan kolom dan bersihkan tanda kutip/spasi
                    const cols = line.split(',').map(val => val.trim().replace(/^["']|["']$/g, ''));
                    const rowId = cols[0] ? cols[0].toLowerCase() : '';

                    if (rowId === cleanSearchId) {
                        matchedRow = cols;
                        break;
                    }
                }

                if (!matchedRow) {
                    document.getElementById('status').innerText = `ID QR "${subId}" tidak ditemukan dalam database.`;
                    return;
                }

                const gmaps_url = matchedRow[2];
                const image_url = matchedRow[3];
                const status = matchedRow[4];
                const kategori = matchedRow[5];

                if (status && status.toLowerCase() !== 'active') {
                    document.getElementById('status').innerText = 'QR Code dinonaktifkan.';
                    return;
                }

                if (kategori && kategori.toLowerCase() === 'bisnis') {
                    window.location.replace(gmaps_url);
                } else {
                    const encodedTarget = encodeURIComponent(gmaps_url);
                    const encodedImage = encodeURIComponent(image_url || '');
                    window.location.replace(`/sponsor.html?target=${encodedTarget}&img=${encodedImage}`);
                }

            } catch (error) {
                console.error(error);
                document.getElementById('status').innerText = 'Gagal memuat data dari spreadsheet.';
            }
        }

        handleRedirect();
    </script>
</body>
</html>
