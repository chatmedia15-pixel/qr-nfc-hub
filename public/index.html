<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Memuat...</title>
    <style>
        body { font-family: Arial, sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; background: #f9f9f9; color: #555; text-align: center; }
    </style>
</head>
<body>
    <div>
        <h3>Sedang memuat tujuan...</h3>
        <p id="status">Mohon tunggu sebentar.</p>
    </div>

    <script>
        // Fungsi parser CSV profesional untuk menangani baris dan tanda kutip dengan benar
        function parseCSV(text) {
            let lines = text.split(/\r\n|\n/);
            let result = [];
            for (let i = 0; i < lines.length; i++) {
                if (!lines[i].trim()) continue;
                let row = [];
                let inQuotes = false;
                let entry = '';
                for (let j = 0; j < lines[i].length; j++) {
                    let char = lines[i][j];
                    if (char === '"' && (j === 0 || lines[i][j-1] !== '\\')) {
                        inQuotes = !inQuotes;
                    } else if (char === ',' && !inQuotes) {
                        row.push(entry.trim());
                        entry = '';
                    } else {
                        entry += char;
                    }
                }
                row.push(entry.trim());
                result.push(row.map(val => val.replace(/^["']|["']$/g, '')));
            }
            return result;
        }

        async function handleRedirect() {
            const urlParams = new URLSearchParams(window.location.search);
            const subId = urlParams.get('id');

            if (!subId) {
                window.location.href = '/admin.html';
                return;
            }

            try {
                const csvUrl = 'https://docs.google.com/spreadsheets/d/1EVqMj-V9Y6r0fclk7tYVQB8Co9fQ1JEmsAhcTXXGVM/export?format=csv';
                
                const response = await fetch(csvUrl);
                const csvText = await response.text();

                const rows = parseCSV(csvText);

                if (!rows || rows.length < 2) {
                    document.getElementById('status').innerText = 'Database kosong.';
                    return;
                }

                const headers = rows[0]; // Header kolom
                const dataRows = rows.slice(1); // Data baris di bawahnya

                const cleanSearchId = subId.trim().toLowerCase();

                // Cari baris yang kolom pertama (id) cocok
                const matchedRow = dataRows.find(row => row[0] && row[0].toLowerCase() === cleanSearchId);

                if (!matchedRow) {
                    document.getElementById('status').innerText = `ID QR "${subId}" tidak ditemukan dalam database.`;
                    return;
                }

                // Berdasarkan urutan kolom: [id, nama_lokasi, gmaps_url, image_url, status, kategori]
                const id = matchedRow[0];
                const nama_lokasi = matchedRow[1];
                const gmaps_url = matchedRow[2];
                const image_url = matchedRow[3];
                const status = matchedRow[4];
                const kategori = matchedRow[5];

                if (status && status.toLowerCase() !== 'active') {
                    document.getElementById('status').innerText = 'QR Code ini sedang dinonaktifkan.';
                    return;
                }

                // Cek kategori
                if (kategori && kategori.toLowerCase() === 'bisnis') {
                    window.location.href = gmaps_url;
                } else {
                    const encodedTarget = encodeURIComponent(gmaps_url);
                    const encodedImage = encodeURIComponent(image_url || '');
                    window.location.href = `/sponsor.html?target=${encodedTarget}&img=${encodedImage}`;
                }

            } catch (error) {
                console.error(error);
                document.getElementById('status').innerText = 'Terjadi kesalahan saat memuat data.';
            }
        }

        handleRedirect();
    </script>
</body>
</html>
