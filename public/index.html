<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Memuat...</title>
    
    <!-- Google tag (gtag.js) - Google Analytics -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-V9L276726D"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());

      gtag('config', 'G-V9L276726D');
    </script>

    <style>
        body { font-family: Arial, sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; background: #000000; color: #888; text-align: center; }
    </style>
</head>
<body>
    <div>
        <h3>Sedang memuat tujuan...</h3>
        <p id="status">.</p>
    </div>

    <script>
        async function handleRedirect() {
            const urlParams = new URLSearchParams(window.location.search);
            const subId = urlParams.get('id');

            if (!subId) {
                window.location.href = '/admin.html';
                return;
            }

            // Kirim Custom Event ke Google Analytics untuk mencatat ID yang di-scan
            if (typeof gtag === 'function') {
                gtag('event', 'qr_scan_id', {
                    'qr_id': subId.toLowerCase()
                });
            }

            try {
                const csvUrl = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQty5Cfk38iLp1fHwLWMUk9Leri1EJcppHrfRmhCvxtWbysft4jMvaVhOB4K_YxZV3zDKBI6_7pqlcZ/pub?gid=0&single=true&output=csv';
                
                const response = await fetch(csvUrl);
                const csvText = await response.text();

                const lines = csvText.trim().split('\n');
                
                if (lines.length < 2) {
                    document.getElementById('status').innerText = 'Database kosong.';
                    return;
                }

                let matchedRow = null;
                for (let i = 1; i < lines.length; i++) {
                    const line = lines[i].trim();
                    if (!line) continue;
                    
                    const cols = line.split(',').map(val => val.trim().replace(/^["']|["']$/g, ''));
                    const rowId = cols[0];

                    if (rowId && rowId.toLowerCase() === subId.trim().toLowerCase()) {
                        matchedRow = cols;
                        break;
                    }
                }

                if (!matchedRow) {
                    document.getElementById('status').innerText = `ID "${subId}" tidak ditemukan.`;
                    return;
                }

                    const gmaps_url = matchedRow[2];
                const image_url = matchedRow[3];
                const status = matchedRow[4];
                const kategori = matchedRow[5];

                if (status && status.toLowerCase() !== 'active') {
                    document.getElementById('status'].innerText = 'QR Code ini sedang dinonaktifkan.';
                    return;
                }

                if (kategori && kategori.toLowerCase() === 'bisnis') {
                    window.location.replace(gmaps_url);
                } else {
                    const encodedTarget = encodeURIComponent(gmaps_url);
                    const encodedImage = encodeURIComponent(image_url || '');
                    window.location.replace(`/sponsor.html?target=${encodedTarget}&img=${encodedImage}`);
                }

            } catch (error) {
                console.error(error);
                document.getElementById('status').innerText = 'Gagal memuat data.';
            }
        }

        handleRedirect();
    </script>
</body>
</html>
