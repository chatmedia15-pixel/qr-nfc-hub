<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Memuat...</title>
    <style>
        body { font-family: Arial, sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; background: #000000; color: #888; text-align: center; }
    </style>
</head>
<body>
    <div>
        <h3>Sedang memuat tujuan...</h3>
        <p id="status">.</p>
    </div>

    <script>
        async function handleRedirect() {
            const urlParams = new URLSearchParams(window.location.search);
            const subId = urlParams.get('id');

            if (!subId) {
                window.location.href = '/admin.html';
                return;
            }

            try {
                // Perbaikan: ditambahkan '?id=' sebelum menyambungkan subId
                const scriptUrl = 'https://script.google.com/macros/s/AKfycbzUONX4xGdg_d4A7BJfEoYmN5k2VWtQP-zlLdq2ukWVPzUPeaAPBUEoxxypXeR6CEhA/exec?id=' + encodeURIComponent(subId);
                
                const response = await fetch(scriptUrl);
                const data = await response.json();

                if (data.status === "error") {
                    document.getElementById('status').innerText = data.message || 'ID tidak ditemukan.';
                    return;
                }

                if (data.status && data.status.toLowerCase() !== 'active') {
                    document.getElementById('status').innerText = 'QR Code ini sedang dinonaktifkan.';
                    return;
                }

                if (data.kategori && data.kategori.toLowerCase() === 'bisnis') {
                    window.location.replace(data.gmaps_url);
                } else {
                    const encodedTarget = encodeURIComponent(data.gmaps_url);
                    const encodedImage = encodeURIComponent(data.image_url || '');
                    window.location.replace(`/sponsor.html?target=${encodedTarget}&img=${encodedImage}`);
                }

            } catch (error) {
                console.error(error);
                document.getElementById('status').innerText = 'Terjadi kesalahan saat memuat data.';
            }
        }

        handleRedirect();
    </script>
</body>
</html>
