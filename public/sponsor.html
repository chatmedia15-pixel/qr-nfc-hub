<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Memuat...</title>
    <style>
        body { 
            font-family: Arial, sans-serif; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            height: 100vh; 
            margin: 0; 
            background: #000000; 
            color: #ffffff;
            text-align: center; 
        }
        .container { 
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        h3 {
            font-size: 16px;
            font-weight: normal;
            color: #aaaaaa;
            margin-bottom: 15px;
            letter-spacing: 1px;
        }
        img { 
            max-width: 220px; 
            height: auto; 
            display: block; 
        }
    </style>
</head>
<body>
    <div class="container">
        <h3>Powered By</h3>
        <div id="banner-container"></div>
    </div>

    <script>
        const params = new URLSearchParams(window.location.search);
        const targetUrl = params.get('target');
        const imageUrl = params.get('img');

        const bannerContainer = document.getElementById('banner-container');

        if (imageUrl && imageUrl !== "undefined" && imageUrl !== "null" && imageUrl.trim() !== "") {
            let cleanImgUrl = decodeURIComponent(imageUrl).trim();
            
            if (cleanImgUrl.startsWith('/')) {
                cleanImgUrl = cleanImgUrl.substring(1);
            }
            if (!cleanImgUrl.startsWith('images/')) {
                cleanImgUrl = `images/${cleanImgUrl}`;
            }

            const imgElement = document.createElement('img');
            imgElement.src = `/${cleanImgUrl}`;
            imgElement.alt = "Logo";

            imgElement.onerror = function() {
                bannerContainer.innerHTML = `<p style="color:red; font-size:12px;">Gagal memuat logo</p>`;
            };

            bannerContainer.appendChild(imgElement);
        } else {
            bannerContainer.innerHTML = `<p style="color:#666; font-size:13px;">Terima kasih</p>`;
        }

        // Otomatis pindah ke Google Maps setelah 2.5 detik tanpa menampilkan angka hitung mundur
        setTimeout(() => {
            if (targetUrl) {
                window.location.href = decodeURIComponent(targetUrl);
            } else {
                window.location.href = "https://google.com";
            }
        }, 2500);
    </script>
</body>
</html>
